services:

######################################################################################################################
# DATABASE & AUTHENTICATION
######################################################################################################################

  # PostgreSQL with the TimescaleDB extension. Holds the Perfana, Keycloak and
  # Grafana databases (the latter two created by ./database/init on first boot).
  postgres:
    image: timescale/timescaledb-ha:pg15
    container_name: perfana-postgres
    environment:
      POSTGRES_DB: perfana
      POSTGRES_USER: perfana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: ["-c", "max_connections=500"]
    # Published on all interfaces so other hosts on the network can reach the database
    # directly (e.g. external BI tools, remote load generators). Requires WSL2 mirrored
    # networking and a scoped firewall rule — see INSTALL.md step 9.6. Auth is scram-sha-256;
    # use a strong POSTGRES_PASSWORD.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata
      - ./database/init:/docker-entrypoint-initdb.d/
    networks:
      - perfana
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfana -d perfana"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Keycloak — authentication / SSO. Uses the shared PostgreSQL instance.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: perfana-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: perfana
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      KC_DB_SCHEMA: public
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      KC_DB_POOL_INITIAL_SIZE: 5
      KC_DB_POOL_MAX_SIZE: 20
      KC_DB_POOL_MIN_SIZE: 5
      KC_HEALTH_ENABLED: true
    # start-dev is intentional: Keycloak is served over plain HTTP and accessed
    # locally via http://localhost:8080 (no TLS in this deployment).
    command: ["start-dev", "--health-enabled=true", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realms:/opt/keycloak/data/import
    networks:
      - perfana
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -m1 '200' <&3 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # One-shot TypeORM migration runner. Brings the Perfana schema up to date
  # then exits 0. Re-run on every upgrade (start.sh / update.sh do this).
  perfana-migration:
    image: perfana/perfana-migration:0.2.61.97
    container_name: perfana-migration
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: perfana
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: perfana
      DB_SSL: "false"
    networks:
      - perfana
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

######################################################################################################################
# PERFANA PLATFORM
######################################################################################################################

  # Hardened Docker Engine API gateway for the admin log viewer. This is the
  # only container that touches the host docker socket. It runs as root inside
  # (so it reads the root:docker socket by owner — no DOCKER_GID needed) and
  # exposes an HAProxy-filtered API on tcp:2375, reachable only on the internal
  # perfana network (no host port). CONTAINERS=1 permits GET list/inspect/logs;
  # every write verb (POST/exec/create) is denied by default — so a compromised
  # perfana-api cannot escape to the host.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    environment:
      CONTAINERS: "1"
      # Everything else stays at the image default (denied).
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - perfana
    restart: unless-stopped

  # Next.js frontend. All values prefixed with PERFANA_HOST are what the
  # browser uses, so they must resolve from the end-user's machine.
  perfana-web:
    image: perfana/perfana-web:0.2.61.97
    container_name: perfana-web
    ports:
      - "${PERFANA_WEB_PORT:-4001}:3000"
    networks:
      - perfana
    environment:
      NODE_ENV: production
      CSP_UPGRADE_INSECURE: "false"
      RUNTIME_API_URL: ${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:3001/api
      RUNTIME_KEYCLOAK_URL: ${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:8080
      RUNTIME_KEYCLOAK_REALM: perfana-prod
      RUNTIME_KEYCLOAK_CLIENT_ID: perfana-web
      RUNTIME_USE_KEYCLOAK_AUTH: "true"
      NEXT_PUBLIC_API_URL: ${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:3001/api
      NEXT_PUBLIC_KEYCLOAK_URL: ${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: perfana-prod
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: perfana-web
      NEXT_PUBLIC_USE_KEYCLOAK_AUTH: "true"
      NEXT_PUBLIC_CSP_FRAME_SRC: ${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:${GRAFANA_PORT:-3100} ${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:8080
      # Admin log viewer UI (must match perfana-api LOG_VIEWER_ENABLED)
      NEXT_PUBLIC_LOG_VIEWER_ENABLED: "true"
      # Admin SUT export/import UI (must match perfana-api SUT_TRANSFER_ENABLED)
      NEXT_PUBLIC_SUT_TRANSFER_ENABLED: "true"
    depends_on:
      perfana-api:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # NestJS API backend.
  perfana-api:
    image: perfana/perfana-api:0.2.61.97
    container_name: perfana-api
    ports:
      - "3001:3001"
    networks:
      - perfana
    environment:
      NODE_ENV: production
      TZ: Europe/Amsterdam
      NODE_OPTIONS: "--max-old-space-size=3584"
      LOG_LEVEL: info
      # Outbound HTTP proxy for external calls (corporate env).
      # Internal service hostnames bypass it via NO_PROXY.
      HTTP_PROXY: http://proxy.example.com:3128
      HTTPS_PROXY: http://proxy.example.com:3128
      NO_PROXY: localhost,127.0.0.1,.svc,postgres,valkey,keycloak,grafana
      HEALTH_HEAP_THRESHOLD_MB: "1500"
      HEALTH_RSS_THRESHOLD_MB: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: perfana
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: perfana
      DB_SSL: "false"
      DB_ENABLE_RLS_ROLE: "true"
      DATABASE_URL: postgresql://perfana:${POSTGRES_PASSWORD}@postgres:5432/perfana?sslmode=disable
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_URL: redis://valkey:6379
      # Keycloak: the API talks to Keycloak over the internal network, but it
      # must also accept tokens whose issuer is the browser-facing host.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: perfana-prod
      KEYCLOAK_CLIENT_ID: perfana-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET must be set in .env}
      KEYCLOAK_ADMIN_CLIENT_ID: perfana-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be set in .env}
      KEYCLOAK_ACCEPTED_ISSUERS: "http://keycloak:8080/realms/perfana-prod,http://localhost:8080/realms/perfana-prod,${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:8080/realms/perfana-prod"
      KEYCLOAK_ACCEPTED_AUDIENCES: "perfana-api,perfana-web,account"
      FRONTEND_URL: ${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:${PERFANA_WEB_PORT:-4001}
      CORS_ALLOWED_ORIGINS: ${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:${PERFANA_WEB_PORT:-4001}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
      # Admin log viewer — reads container logs via the Docker Engine API.
      # It talks to docker-socket-proxy over TCP, never the raw socket, so a
      # compromised api can only list/inspect containers and read logs — not
      # create containers or exec into them (see the docker-socket-proxy
      # service). LOG_VIEWER_COMPOSE_PROJECT must match this stack's compose
      # project; both derive from COMPOSE_PROJECT_NAME so they can never drift.
      LOG_VIEWER_ENABLED: "true"
      LOG_VIEWER_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-perfana}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Admin SUT export/import (admin-only; exports SUT data to a downloadable file)
      SUT_TRANSFER_ENABLED: "true"
    volumes:
      - ./perfana/provisioning:/data/provisioning:ro
    depends_on:
      docker-socket-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "const http = require('http'); http.get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 512M

  # BullMQ worker — runs the analysis pipeline and pulls metrics from Grafana.
  perfana-worker:
    image: perfana/perfana-worker:0.2.61.97
    container_name: perfana-worker
    networks:
      - perfana
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      # Outbound HTTP proxy for external calls (corporate env).
      # Internal service hostnames bypass it via NO_PROXY.
      HTTP_PROXY: http://proxy.example.com:3128
      HTTPS_PROXY: http://proxy.example.com:3128
      NO_PROXY: localhost,127.0.0.1,.svc,postgres,valkey,keycloak,grafana
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: perfana
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: perfana
      DB_SSL: "false"
      DATABASE_URL: postgresql://perfana:${POSTGRES_PASSWORD}@postgres:5432/perfana?sslmode=disable
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_URL: redis://valkey:6379
      GRAFANA_URL: http://grafana:3000
      GRAFANA_CONCURRENCY: "30"
      GRAFANA_BATCH_SIZE: "20"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4096M
        reservations:
          cpus: '1'
          memory: 1024M

  # Keeps Grafana dashboards in sync with Perfana's templates.
  perfana-grafana-sync:
    image: perfana/perfana-grafana-sync:0.2.61.97
    container_name: perfana-grafana-sync
    networks:
      - perfana
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: perfana
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: perfana
      DB_SSL: "false"
      GRAFANA_SYNC_ENABLED: "true"
      GRAFANA_SYNC_INTERVAL_MINUTES: "5"
      AUTO_CONFIG_ENABLED: "true"
      SANITY_CHECK_ENABLED: "true"
      USE_GRAFANA_DB_DIRECT_ACCESS: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      grafana:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # PDF report generation (runs headless Chromium).
  perfana-report:
    image: perfana/perfana-report:0.2.61.97
    container_name: perfana-report
    networks:
      - perfana
    environment:
      NODE_ENV: production
      PORT: "3003"
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: perfana
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: perfana
      DB_SSL: "false"
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      BROWSER_POOL_SIZE: "1"
      PDF_TIMEOUT_MS: "90000"
      QUEUE_CONCURRENCY: "1"
      CHROMIUM_EXECUTABLE_PATH: "/usr/bin/chromium-browser"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"
      PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 1024M
    shm_size: '1gb'

######################################################################################################################
# INFRASTRUCTURE
######################################################################################################################

  # Valkey (Redis-compatible) — BullMQ job queue.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: perfana-valkey
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - perfana
    volumes:
      - valkey-storage:/data
    command: valkey-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana. Perfana reads metrics through this instance. Its data sources are
  # provisioned from ./grafana/provisioning/datasources/datasources.yaml and
  # point at your EXISTING observability backends (see .env: *_URL variables).
  grafana:
    image: grafana/grafana:12.4
    container_name: perfana-grafana
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-perfana}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_PLUGINS_PREINSTALL_SYNC: "marcusolsson-json-datasource,grafana-pyroscope-app"
      # Secrets / config consumed by provisioning (env interpolation).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PERFANA_ALERTS_WEBHOOK_URL: ${PERFANA_ALERTS_WEBHOOK_URL:-http://perfana-api:3001/api/grafana-alerts}
      # OAuth2 / Keycloak SSO. AUTH_URL is browser-facing; TOKEN/API URLs are
      # server-to-server over the internal network.
      GF_SERVER_ROOT_URL: ${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:${GRAFANA_PORT:-3100}
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Perfana"
      GF_AUTH_GENERIC_OAUTH_ICON: "signin"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:?GRAFANA_OAUTH_CLIENT_SECRET must be set in .env}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email groups"
      GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES: "false"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "${PERFANA_SCHEME:-http}://${PERFANA_HOST:-localhost}:8080/realms/perfana-prod/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://keycloak:8080/realms/perfana-prod/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://keycloak:8080/realms/perfana-prod/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'perfana-admins') && 'Admin' || contains(groups[*], 'perfana-users') && 'Editor' || 'Viewer'"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - perfana
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

######################################################################################################################
networks:
  perfana:
    driver: bridge

######################################################################################################################
# Named volumes. All Docker volumes live under Docker's data-root, which the
# install guide configures to live on the dedicated share/disk inside WSL2.
volumes:
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
  valkey-storage:
    driver: local
  grafana-storage:
    driver: local
