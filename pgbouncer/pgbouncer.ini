[pgbouncer]
listen_addr = *
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

admin_users = perfana
stats_users = perfana

pool_mode = transaction
max_client_conn = 200
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 80
max_user_connections = 80
max_prepared_statements = 100

server_idle_timeout = 300
server_lifetime = 3600

ignore_startup_parameters = extra_float_digits,statement_timeout,lock_timeout,idle_in_transaction_session_timeout,search_path,options

log_connections = 1
log_disconnections = 1
verbose = 0

[databases]
perfana = host=postgres port=5432 dbname=perfana
keycloak = host=postgres port=5432 dbname=keycloak
