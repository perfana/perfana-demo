; PgBouncer — connection pooler in front of PostgreSQL, for load generator traffic only.
; The Perfana services connect to postgres:5432 directly and never pass through here.

[pgbouncer]
listen_addr = *
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

admin_users = perfana
stats_users = perfana

; transaction pooling: a server connection is held only for the duration of a
; transaction, so a large fleet of generators maps onto a small, bounded set of
; PostgreSQL backends. The JMeter TimescaleDB listener batches inserts, which is
; exactly the workload this mode suits.
pool_mode = transaction
max_client_conn = 500
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 80
max_user_connections = 80
max_prepared_statements = 100

server_idle_timeout = 300
server_lifetime = 3600

ignore_startup_parameters = extra_float_digits,statement_timeout,lock_timeout,idle_in_transaction_session_timeout,search_path,options

log_connections = 1
log_disconnections = 1
verbose = 0

[databases]
; Only the Perfana database is exposed. Keycloak and Grafana talk to PostgreSQL
; directly and have no reason to be reachable through the pooler.
perfana = host=postgres port=5432 dbname=perfana
