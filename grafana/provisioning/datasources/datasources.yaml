# ==================================================================================================
# Grafana data sources
# --------------------------------------------------------------------------------------------------
# Only Perfana's own TimescaleDB is provisioned. Its UID ("postgres-timescaledb")
# is stable because the dashboards in ./grafana/dashboards reference it by UID -
# do not rename it. Add other data sources from the Grafana UI if needed.
# ==================================================================================================
apiVersion: 1

datasources:
  - name: PostgreSQL-timescaledb
    type: grafana-postgresql-datasource
    uid: postgres-timescaledb
    url: postgres:5432
    access: proxy
    editable: false
    user: perfana
    database: perfana
    jsonData:
      timescaledb: true
      sslmode: 'disable'
      maxOpenConns: 100
      maxIdleConns: 100
      postgresVersion: 1500
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
