[database]
# Grafana stores its own state (users, dashboards, prefs) in the shared
# PostgreSQL instance, in a dedicated "grafana" database created by
# ./database/init/03-create-grafana-db.sql on first boot.
# The password is read from the POSTGRES_PASSWORD env var passed to the
# container (see docker-compose.yml), so it is never hard-coded here.
type = postgres
host = postgres:5432
name = grafana
user = perfana
password = $__env{POSTGRES_PASSWORD}
ssl_mode = disable
