perfana:
  apiKey: "${PERFANA_API_KEY}"
  apiUrl: "http://localhost:13001"
  appUrl: "http://localhost:14000"

test:
  systemUnderTest: "lab-sut-d"
  environment: "lab"
  workload: "lab-soak"
  analysisStartOffset: "PT30S"
  constantLoadTime: "PT1H"
  tags: ["lab", "stage-1", "ingest"]
  annotations: "lab/db-stress-18k-rps stage 1 ingestion soak"

events:
  - name: drivers-sut-d
    type: command
    continueOnKeepAliveParticipant: true
    commands:
      onBeforeTest: "DRIVER_TEST_RUN_ID=__testRunId__ docker compose -f lab/docker-compose.drivers.yml --env-file lab/.env up -d driver-10 driver-11 driver-12"
      onKeepAlive: "docker ps --filter name=perfana-lab-driver-10 --filter name=perfana-lab-driver-11 --filter name=perfana-lab-driver-12 --filter status=running -q | grep -q ."
      onAbort: "docker compose -f lab/docker-compose.drivers.yml stop driver-10 driver-11 driver-12"
