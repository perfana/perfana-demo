perfana:
  apiKey: "${PERFANA_API_KEY}"
  apiUrl: "http://localhost:13001"
  appUrl: "http://localhost:14000"

test:
  systemUnderTest: "lab-sut-a"
  environment: "lab"
  workload: "lab-soak"
  analysisStartOffset: "PT30S"
  constantLoadTime: "PT1H"
  tags: ["lab", "stage-1", "ingest"]
  annotations: "lab/db-stress-18k-rps stage 1 ingestion soak"

events:
  - name: drivers-sut-a
    type: command
    continueOnKeepAliveParticipant: true
    commands:
      onBeforeTest: "DRIVER_TEST_RUN_ID=__testRunId__ docker compose -f lab/docker-compose.drivers.yml --env-file lab/.env up -d driver-1 driver-2 driver-3 driver-4 driver-5 driver-6 driver-7 driver-8 driver-9 driver-10 driver-11 driver-12"
      onKeepAlive: "test $(docker ps --filter status=running --format '{{.Names}}' | grep -c '^perfana-lab-driver-') -eq 12"
      onAbort: "docker compose -f lab/docker-compose.drivers.yml stop driver-1 driver-2 driver-3 driver-4 driver-5 driver-6 driver-7 driver-8 driver-9 driver-10 driver-11 driver-12"
