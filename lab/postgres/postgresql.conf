# Lab postgres tuning — ported from praegus-gitops, sized for 8GB container
# Spec: docs/superpowers/specs/2026-05-06-db-stress-18k-rps-lab-design.md §4.1
listen_addresses = '*'

# Connection sizing
max_connections = 200

# Memory (50% / 75% of 8GB container)
shared_buffers = 4GB
effective_cache_size = 6GB
work_mem = 64MB
maintenance_work_mem = 512MB

# I/O (SSD)
random_page_cost = 1.1
effective_io_concurrency = 200
bgwriter_lru_maxpages = 400

# Parallelism
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_worker_processes = 16

# WAL
max_wal_size = 8GB
min_wal_size = 2GB
max_slot_wal_keep_size = 4GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on

# Simulated SAN fsync latency (lab runs on macOS Apple Silicon under Docker
# Desktop, so wal_sync_method=fsync_writethrough is unavailable on Linux
# Postgres). commit_delay forces group-commit to wait ~2ms before fsync,
# approximating SAN-backed VMDK durability. Without it the lab measures
# host-cache-flush latency, not durable storage.
commit_delay = 2000      # microseconds
commit_siblings = 5      # only delay if 5+ concurrent transactions

# Disk
temp_file_limit = 40GB

# TimescaleDB
shared_preload_libraries = 'timescaledb,pg_stat_statements'
timescaledb.max_background_workers = 16
jit = off

# Limits
statement_timeout = 600s

# Observability
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_activity_query_size = 8kB
track_io_timing = on
